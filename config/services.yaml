# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stripe.public_key: '%env(STRIPE_PUBLIC_KEY)%'
    stripe.secret_key: '%env(STRIPE_SECRET_KEY)%'
    upload_dir: '%kernel.project_dir%/public/uploads/products'
    mailer.from_email: '%env(MAILER_FROM_EMAIL)%'
    mailer.from_name: '%env(MAILER_FROM_NAME)%'
    turnstile.site_key: '%env(TURNSTILE_SITE_KEY)%'
    turnstile.secret_key: '%env(TURNSTILE_SECRET_KEY)%'
    behold.feed_id: '%env(BEHOLD_FEED_ID)%'
    gemini.api_key: '%env(GEMINI_API_KEY)%'
    gemini.monthly_budget_usd: '%env(float:GEMINI_MONTHLY_BUDGET_USD)%'
    gemini.pro_model: '%env(GEMINI_PRO_MODEL)%'
    gemini.pro_cost_usd: '%env(float:GEMINI_PRO_COST_USD)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $uploadDir: '%upload_dir%'
            string $mailerFromEmail: '%mailer.from_email%'
            string $mailerFromName: '%mailer.from_name%'
            string $appEnv: '%kernel.environment%'
            string $turnstileSiteKey: '%turnstile.site_key%'
            string $turnstileSecretKey: '%turnstile.secret_key%'
            string $beholdFeedId: '%behold.feed_id%'
            string $geminiApiKey: '%gemini.api_key%'
            float $monthlyBudgetUsd: '%gemini.monthly_budget_usd%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\StripeService:
        arguments:
            $stripeSecretKey: '%stripe.secret_key%'

    App\Controller\Shop\CheckoutController:
        arguments:
            $stripePublicKey: '%stripe.public_key%'

    # AI visual generation — Gemini 3 Pro Image Preview for all visual types
    App\Service\Gemini\GeminiImageClient:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $geminiApiKey: '%gemini.api_key%'
            $modelName: '%gemini.pro_model%'

    App\Service\Generator\GeminiVisualGenerator:
        arguments:
            $estimatedCostUsd: '%gemini.pro_cost_usd%'
