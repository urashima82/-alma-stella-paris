# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    # The o2switch front (LiteSpeed) drops PATCH requests before they reach
    # the app, breaking every EasyAdmin index toggle. admin-method-override.js
    # rewrites those PATCH fetches to POST + `_method=PATCH`, which this
    # setting lets Symfony interpret as the original method.
    http_method_override: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@prod:
    framework:
        trusted_proxies: '%env(TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
