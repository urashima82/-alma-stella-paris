framework:
    rate_limiter:
        contact_form:
            policy: fixed_window
            limit: 3
            interval: '15 minutes'
        admin_login:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        registration:
            policy: fixed_window
            limit: 5
            interval: '30 minutes'
        checkout:
            policy: fixed_window
            limit: 10
            interval: '15 minutes'
        email_check:
            policy: sliding_window
            limit: 15
            interval: '5 minutes'
        gemini_api:
            policy: token_bucket
            limit: 15
            rate: { interval: '1 minute', amount: 15 }
