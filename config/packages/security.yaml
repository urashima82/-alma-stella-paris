security:
    providers:
        admin_provider:
            entity:
                class: App\Entity\Admin
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_provider
            entry_point: App\Security\AdminAuthenticationEntryPoint
            login_link:
                check_route: admin_login_check
                signature_properties: ['email', 'lastLoggedInAt']
                lifetime: 600
                max_uses: 1
                default_target_path: /admin
            logout:
                path: admin_logout
                target: admin_login
        main:
            lazy: true

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
