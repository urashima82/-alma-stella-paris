framework:
    messenger:
        failure_transport: failed

        transports:
            sync: 'sync://'

            gemini_async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: gemini_generation
                retry_strategy:
                    max_retries: 2
                    delay: 5000
                    multiplier: 2
                    max_delay: 30000

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            App\Message\GenerateVisualMessage: gemini_async

when@test:
    framework:
        messenger:
            transports:
                gemini_async: 'in-memory://'
