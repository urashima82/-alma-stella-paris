    value_2_title: "Natural materials"
    value_2_text: "Turquoise, opal, quartz, moonstone, mother of pearl — each stone tells its own story."
    value_3_title: "Crafted to last"
    value_3_text: "Water-resistant stainless steel. Wear it everywhere, every day."
    banner_country: "Mexico"
    banner_subtitle: "Where the world's energy meets French elegance."
