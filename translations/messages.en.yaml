    paragraph_1: "I'm Estelle, the \"Stella\" behind this brand inspired by the stars, the moon, and the energies that surround us. 🌙"
    paragraph_2: "Between France, a symbol of elegance, and Mexico, a vibrant and spiritual land, I curated these jewels that are not just beautiful… but deeply charged with meaning."
    paragraph_3: "Each one is designed as a talisman ✨ — a piece of jewelry that walks with you, grounds you, and reveals your inner light."
