    data_heading: "Personal data"
    data_text_1: "Information collected during your order (name, address, email) is necessary for processing and delivering your jewelry. It is never shared with third parties for commercial purposes."
    data_text_2: "In accordance with the General Data Protection Regulation (GDPR), you have the right to access, rectify, and delete your personal data. To exercise this right, contact us via the contact form on this website."
    cookies_heading: "Cookies"
    cookies_text: "This website uses only strictly necessary cookies for its operation (session, currency and language preferences). No advertising or tracking cookies are used."
    design_heading: "Website design & development"
