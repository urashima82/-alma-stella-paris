# ── About page ──
about:
    title: "À propos | Alma Stella Paris"
    meta_description: "Alma Stella Paris est née de la passion d'Estelle pour la recherche de beaux bijoux résistants à l'eau entre Paris et Mexico."
    heading: "Une histoire entre deux mondes."
    paragraph_1: "Je suis Estelle, la « Stella » derrière cette marque inspirée par les astres, la lune et les énergies qui nous entourent. 🌙"
    paragraph_2: "Entre la France, symbole d'élégance, et le Mexique, terre vibrante et spirituelle, j'ai sélectionné ces bijoux qui ne sont pas seulement beaux… mais profondément chargés de sens."
    paragraph_3: "Chacun est pensé comme un talisman ✨ : un bijou qui vous accompagne, vous recentre et révèle votre lumière intérieure."
    philosophy_label: "Notre philosophie"
    philosophy_heading: "Ce en quoi nous croyons"
    value_1_title: "Sélectionnés personnellement"
    value_1_text: "Chaque pièce est sélectionnée à la main par Estelle lors de ses voyages entre Paris et le Mexique."
    value_2_title: "Matériaux naturels"
    value_2_text: "Turquoise, opale, quartz, pierre de lune, nacre — chaque pierre raconte sa propre histoire."
    value_3_title: "Conçus pour durer"
    value_3_text: "Acier inoxydable résistant à l'eau. Portez-les partout, tous les jours."
    banner_country: "Mexique"
    banner_subtitle: "Là où l'énergie du monde rencontre l'élégance française."

