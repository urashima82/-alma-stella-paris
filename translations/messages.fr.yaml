# ── CGV ──
terms:
    title: "Conditions générales de vente | Alma Stella Paris"
    meta_description: "Conditions générales de vente d'Alma Stella Paris. Informations sur les commandes, paiements, livraisons et retours."
    heading: "Conditions générales de vente"
    preamble_heading: "Préambule"
    preamble_text: "Les présentes conditions générales de vente (CGV) régissent l'ensemble des ventes réalisées sur le site almastellaparis.com, édité par Estelle Bédé, entrepreneur individuel. Toute commande implique l'acceptation pleine et entière des présentes CGV."
    products_heading: "Produits"
    products_text_1: "Alma Stella Paris propose des bijoux en acier inoxydable avec pierres naturelles. Chaque pièce est unique et disponible en un seul exemplaire. Les photographies sont aussi fidèles que possible, mais de légères variations de couleur ou de texture peuvent exister en raison du caractère naturel des pierres."
    products_text_2: "Lorsqu'une pièce est vendue, elle est retirée de la vente et ne peut être commandée à nouveau."
    prices_heading: "Prix"
    prices_text_1: "Tous les prix sont indiqués en dollars américains (USD), devise de référence. Les prix affichés dans d'autres devises (EUR, CAD, GBP, MXN) sont donnés à titre indicatif et calculés sur la base de taux de change actualisés."
    prices_text_2: "Les frais de livraison sont inclus dans le prix affiché. Le montant débité correspond au prix en USD au moment de la commande."
    orders_heading: "Commandes"
    orders_text: "La commande est validée après confirmation du paiement. Un e-mail de confirmation est envoyé à l'adresse indiquée lors de la commande. Alma Stella Paris se réserve le droit d'annuler toute commande en cas de problème de paiement ou de suspicion de fraude."
    payment_heading: "Paiement"
    payment_text: "Le paiement s'effectue en ligne par carte bancaire via la plateforme sécurisée Stripe. Le débit est effectué en dollars américains (USD) au moment de la validation de la commande. Alma Stella Paris ne stocke aucune donnée bancaire."
    shipping_heading: "Livraison"
    shipping_text_1: "Les commandes sont expédiées depuis la France ou le Mexique selon la disponibilité. Le délai de livraison estimé est de 7 à 14 jours ouvrés à l'international."
    shipping_text_2: "Alma Stella Paris ne peut être tenue responsable des retards de livraison imputables au transporteur ou aux formalités douanières."
    returns_heading: "Droit de rétractation et retours"
    returns_text_1: "Conformément à la législation en vigueur, vous disposez d'un délai de 14 jours à compter de la réception de votre commande pour exercer votre droit de rétractation."
    returns_text_2: "Tout retour doit être précédé d'une prise de contact via le formulaire de contact du site afin de recevoir l'adresse postale de retour. Aucun retour ne sera accepté sans cette étape préalable."
    returns_text_3: "À réception du bijou retourné (dans son état d'origine, non porté), vous pourrez choisir entre un remboursement intégral ou un échange contre un bijou de valeur équivalente. Les frais de retour sont à la charge du client."
    warranty_heading: "Garanties"
    warranty_text: "Tous les bijoux bénéficient de la garantie légale de conformité (articles L.217-4 et suivants du Code de la consommation) et de la garantie des vices cachés (articles 1641 et suivants du Code civil). En cas de défaut de fabrication constaté, contactez-nous via le formulaire de contact du site."
    liability_heading: "Responsabilité"
    liability_text: "Alma Stella Paris ne saurait être tenue responsable des dommages résultant d'une mauvaise utilisation des produits. Les bijoux en acier inoxydable sont résistants à l'eau, mais un entretien régulier est recommandé pour préserver leur éclat."
    law_heading: "Droit applicable"
    law_text: "Les présentes CGV sont soumises au droit français. En cas de litige, une solution amiable sera recherchée avant toute action judiciaire. À défaut, les tribunaux compétents de Toulouse seront seuls compétents."

