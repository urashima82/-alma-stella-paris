# ── About page ──
about:
    title: "À propos | Alma Stella Paris"
    meta_description: "Alma Stella Paris est née de la passion d'Estelle pour la recherche de beaux bijoux résistants à l'eau entre Paris et Mexico."
    heading: "Une histoire entre deux mondes."
    paragraph_1: "Alma Stella Paris est née de la passion d'Estelle pour les voyages et la découverte de la beauté dans des lieux inattendus. Entre l'élégance de Paris et l'énergie vibrante du Mexique, chaque pièce est personnellement sourcée et choisie avec intention."
    paragraph_2: "Nos bijoux sont faits pour être portés tous les jours — au bord de la mer, en ville, au marché. Résistants à l'eau, durables, et toujours beaux."
    philosophy_label: "Notre philosophie"
    philosophy_heading: "Ce en quoi nous croyons"
    value_1_title: "Sélectionnés personnellement"
    value_1_text: "Chaque pièce est sélectionnée à la main par Estelle lors de ses voyages entre Paris et le Mexique."
    value_2_title: "Matériaux naturels"
    value_2_text: "Turquoise, opale, quartz, pierre de lune, nacre — chaque pierre raconte sa propre histoire."
    value_3_title: "Conçus pour durer"
    value_3_text: "Acier inoxydable résistant à l'eau avec placage or 18 carats. Portez-les partout, tous les jours."
    banner_subtitle: "Là où l'énergie du monde rencontre l'artisanat intemporel."

